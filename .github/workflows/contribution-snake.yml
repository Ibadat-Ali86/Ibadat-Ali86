name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    name: Render and publish SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Render light and dark contribution trails
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#007B9E&color_dots=#EBEDF0,#D7E8B4,#A5D64B,#78A80D,#456F00
            dist/github-contribution-grid-snake-dark.svg?color_snake=#46D9FF&color_dots=#161B22,#223414,#3C6216,#6FA91F,#B8FF29

      - name: Publish generated SVGs to the output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true

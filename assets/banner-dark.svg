<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ibadat Ali terminal portfolio banner</title>
  <desc id="desc">ASCII art banner for a data scientist, machine learning engineer, and DevOps practitioner.</desc>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/></filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8FF29" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#46D9FF" stop-opacity="0.75"/>
    </linearGradient>
    <style>
      .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 27px; font-weight: 700; fill: #F2F5F7; letter-spacing: 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 2.2px; fill: #98A4B3; }
      .copy { font-size: 18px; fill: #F2F5F7; }
      .accent { fill: #B8FF29; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="30" fill="#070A0F"/>
  <circle cx="1045" cy="82" r="155" fill="#B8FF29" opacity="0.24" filter="url(#blur)"/>
  <circle cx="170" cy="390" r="170" fill="#2EC5FF" opacity="0.20" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="38" y="34" width="1124" height="352" rx="26" fill="#111722" fill-opacity="0.72" stroke="url(#edge)" stroke-width="1.6"/>
    <rect x="39" y="35" width="1122" height="350" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <circle cx="72" cy="66" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="66" r="6" fill="#FEBC2E"/>
  <circle cx="116" cy="66" r="6" fill="#28C840"/>
  <text x="144" y="72" class="mono label">IBADAT_ALI / PROFILE.EXE</text>
  <text x="92" y="126" class="ascii" xml:space="preserve">#####  ####    ###   ####    ###   #####</text><text x="92" y="165" class="ascii" xml:space="preserve">  #    #   #  #   #  #   #  #   #    #  </text><text x="92" y="204" class="ascii" xml:space="preserve">  #    ####   #####  #   #  #####    #  </text><text x="92" y="243" class="ascii" xml:space="preserve">  #    #   #  #   #  #   #  #   #    #  </text><text x="92" y="282" class="ascii" xml:space="preserve">#####  ####   #   #  ####   #   #    #  </text>
  <text x="850" y="190" class="mono" font-size="34" font-weight="700" fill="#B8FF29">ALI</text>
  <text x="850" y="225" class="mono" font-size="16" fill="#98A4B3">AI SYSTEMS</text>
  <text x="850" y="252" class="mono" font-size="16" fill="#98A4B3">RESEARCH ENGINEERING</text>
  <text x="850" y="279" class="mono" font-size="16" fill="#98A4B3">FULL-STACK DELIVERY</text>
  <line x1="92" y1="326" x2="1108" y2="326" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <text x="92" y="356" class="mono copy"><tspan class="accent">$</tspan> data_scientist x ml_engineer x devops <tspan class="cursor accent">|</tspan></text>
  <text x="1108" y="356" text-anchor="end" class="mono label">DATA -&gt; DECISION -&gt; DELIVERY</text>
</svg>